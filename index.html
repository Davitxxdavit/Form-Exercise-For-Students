<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form Exercise - Student Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .radio-group,
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 8px;
        }
        
        .radio-item,
        .checkbox-item {
            display: flex;
            align-items: center;
        }
        
        input[type="radio"],
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 6px;
            cursor: pointer;
        }
        
        .range-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        input[type="range"] {
            flex: 1;
        }
        
        .range-value {
            font-weight: bold;
            color: #667eea;
            min-width: 40px;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .reset-btn {
            width: 100%;
            padding: 12px;
            background: white;
            color: #666;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
        }
        
        .reset-btn:hover {
            border-color: #999;
            color: #333;
        }
        
        small {
            display: block;
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .required {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Registration Form</h1>
        <p class="subtitle">Practice Exercise: HTML Form Elements</p>
        
        <form id="registrationForm" action="#" method="POST">
            
            <!-- Text Input -->
            <div class="form-group">
                <label for="fullname">Full Name <span class="required">*</span></label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </div>
            
            <!-- Email Input -->
            <div class="form-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
                <small>We'll never share your email with anyone else.</small>
            </div>
            
            <!-- Password Input -->
            <div class="form-group">
                <label for="password">Password <span class="required">*</span></label>
                <input type="password" id="password" name="password" placeholder="Enter password" minlength="6" required>
                <small>Must be at least 6 characters long.</small>
            </div>
            
            <!-- Telephone Input -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567" pattern="[0-9+\-\(\) ]+">
            </div>
            
            <!-- Date Input -->
            <div class="form-group">
                <label for="birthdate">Date of Birth <span class="required">*</span></label>
                <input type="date" id="birthdate" name="birthdate" required>
            </div>
            
            <!-- Number Input -->
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="16" max="100" placeholder="18">
            </div>
            
            <!-- Radio Buttons -->
            <div class="form-group">
                <label>Gender <span class="required">*</span></label>
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" id="male" name="gender" value="male" required>
                        <label for="male">Male</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="other" name="gender" value="other">
                        <label for="other">Other</label>
                    </div>
                </div>
            </div>
            
            <!-- Select Dropdown -->
            <div class="form-group">
                <label for="course">Select Course <span class="required">*</span></label>
                <select id="course" name="course" required>
                    <option value="">-- Choose a course --</option>
                    <option value="web-dev">Web Development</option>
                    <option value="data-science">Data Science</option>
                    <option value="mobile-dev">Mobile Development</option>
                    <option value="ui-ux">UI/UX Design</option>
                    <option value="cyber-security">Cyber Security</option>
                </select>
            </div>
            
            <!-- Checkboxes -->
            <div class="form-group">
                <label>Programming Languages You Know:</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="html" name="languages" value="html">
                        <label for="html">HTML</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="css" name="languages" value="css">
                        <label for="css">CSS</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="javascript" name="languages" value="javascript">
                        <label for="javascript">JavaScript</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="python" name="languages" value="python">
                        <label for="python">Python</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="java" name="languages" value="java">
                        <label for="java">Java</label>
                    </div>
                </div>
            </div>
            
            <!-- Range Input -->
            <div class="form-group">
                <label for="experience">Experience Level (years)</label>
                <div class="range-group">
                    <input type="range" id="experience" name="experience" min="0" max="10" value="0" oninput="document.getElementById('expValue').textContent = this.value">
                 
                </div>
            </div>
            
            <!-- URL Input -->
            <div class="form-group">
                <label for="portfolio">Portfolio Website</label>
                <input type="url" id="portfolio" name="portfolio" placeholder="https://yourwebsite.com">
            </div>
            
            <!-- Textarea -->
            <div class="form-group">
                <label for="comments">Why do you want to join this course?</label>
                <textarea id="comments" name="comments" placeholder="Tell us about your motivation..."></textarea>
            </div>
            
            <!-- Checkbox for Terms -->
            <div class="form-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the terms and conditions <span class="required">*</span></label>
                </div>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Register Now</button>
            
            <!-- Reset Button -->
            <button type="reset" class="reset-btn">Clear Form</button>
            
        </form>
    </div>
    
    <script>
        // Form submission handler
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Collect form data
            const formData = new FormData(this);
            const data = {};
            
            for (let [key, value] of formData.entries()) {
                if (data[key]) {
                    if (Array.isArray(data[key])) {
                        data[key].push(value);
                    } else {
                        data[key] = [data[key], value];
                    }
                } else {
                    data[key] = value;
                }
            }
            
            // Display submitted data
            console.log('Form Data:', data);
            alert('Form submitted successfully! Check the console (F12) to see the submitted data.');
        });
    </script>
</body>
</html>
